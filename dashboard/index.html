<style>
/* Layout: cabecera con selector de ticker, veredicto arriba, diccionario de conceptos en tarjetas con los números reales debajo */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --surface2: #e9edf4;
  --ink: #131f2e;
  --ink2: #52617a;
  --line: #d7ddE8;
  --accent: #1b5cd1;
  --accent-soft: #e2ebfb;
  --good: #15774a;
  --good-soft: #ddf2e6;
  --warn: #8f5f00;
  --warn-soft: #fbeece;
  --bad: #b3261e;
  --bad-soft: #fbe2df;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c121a; --surface: #141c27; --surface2: #1c2635; --ink: #e5ebf4; --ink2: #9aa8bd; --line: #263244;
    --accent: #6fa3ff; --accent-soft: #19294a;
    --good: #4cc38a; --good-soft: #11301f; --warn: #e3b341; --warn-soft: #382c0b; --bad: #ff7b72; --bad-soft: #3b1a18;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c121a; --surface: #141c27; --surface2: #1c2635; --ink: #e5ebf4; --ink2: #9aa8bd; --line: #263244;
  --accent: #6fa3ff; --accent-soft: #19294a;
  --good: #4cc38a; --good-soft: #11301f; --warn: #e3b341; --warn-soft: #382c0b; --bad: #ff7b72; --bad-soft: #3b1a18;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 24px 64px; }
.wrap { max-width: 1080px; margin-inline: auto; display: flex; flex-direction: column; gap: 40px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: clamp(28px, 5vw, 40px); font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
h3 { font-size: 17px; font-weight: 500; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
.muted { color: var(--ink2); }

header { display: flex; flex-direction: column; gap: 16px; }
.head-top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between; }
.head-top > div { min-width: 0; }
.tickers { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 500; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #0c121a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #0c121a; } }

section { display: flex; flex-direction: column; gap: 16px; }
.sec-head { display: flex; flex-direction: column; gap: 4px; }
.sec-head p { max-width: 65ch; color: var(--ink2); }

.verdict { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; width: fit-content; }
.t-good { background: var(--good-soft); color: var(--good); }
.t-ok { background: var(--surface2); color: var(--ink2); }
.t-warn { background: var(--warn-soft); color: var(--warn); }
.t-bad { background: var(--bad-soft); color: var(--bad); }
.verdict .headline { font-family: var(--font-display); font-size: clamp(22px, 3.6vw, 30px); font-weight: 700; line-height: 1.2; text-wrap: balance; }
.verdict .summary { max-width: 72ch; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--ink2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.tile .v { font-family: var(--font-mono); font-size: 24px; font-weight: 500; }
.tile .s { font-size: 12.5px; color: var(--ink2); }
.tile.good .v { color: var(--good); } .tile.warn .v { color: var(--warn); } .tile.bad .v { color: var(--bad); }

.range { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.range-bar { position: relative; height: 10px; border-radius: 999px; background: linear-gradient(90deg, var(--bad-soft), var(--surface2) 50%, var(--good-soft)); border: 1px solid var(--line); }
.range-dot { position: absolute; top: 50%; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); transform: translate(-50%, -50%); box-shadow: 0 0 0 1px var(--accent); }
.range-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink2); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; }

.scores { display: flex; flex-direction: column; gap: 14px; }
.score { display: grid; grid-template-columns: 150px 1fr; gap: 4px 16px; align-items: center; }
.score .name { font-weight: 600; }
.bar { height: 10px; border-radius: 999px; background: var(--surface2); overflow: hidden; display: flex; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.score .text { grid-column: 2; font-size: 13.5px; color: var(--ink2); }
.score .num { font-family: var(--font-mono); font-size: 13px; color: var(--ink2); }
@media (max-width: 560px) { .score { grid-template-columns: 1fr; } .score .text { grid-column: 1; } }

.scen { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.scen .panel { gap: 6px; }
.scen .p { font-family: var(--font-mono); font-size: 13px; color: var(--ink2); }
.scen .px { font-family: var(--font-mono); font-size: 22px; font-weight: 500; }

dl.plan { margin: 0; display: grid; grid-template-columns: minmax(130px, 200px) 1fr; gap: 10px 16px; }
dl.plan dt { font-weight: 600; color: var(--ink2); }
dl.plan dd { margin: 0; }
@media (max-width: 560px) { dl.plan { grid-template-columns: 1fr; gap: 2px; } dl.plan dd { margin-bottom: 10px; } }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar input { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; min-width: 0; flex: 1 1 180px; max-width: 280px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.card-top .en { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink2); word-break: break-word; }
.card .num-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.big { font-family: var(--font-mono); font-size: 28px; font-weight: 500; line-height: 1.1; }
.sub { font-size: 12.5px; color: var(--ink2); font-family: var(--font-mono); }
.up { color: var(--good); } .down { color: var(--bad); }
.spark { display: block; width: 130px; height: 40px; }
.spark-labels { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--ink2); font-family: var(--font-mono); width: 130px; }
.facts { display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.facts b { display: block; font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink2); font-weight: 600; }
.facts .mine { background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
.extras { display: flex; flex-wrap: wrap; gap: 4px 14px; }

footer { display: flex; flex-direction: column; gap: 12px; font-size: 13.5px; color: var(--ink2); }
footer a { color: var(--accent); }
footer ul { margin: 0; padding-left: 18px; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .4s ease; } }
</style>

<script>
/* ---------- Diccionario de conceptos (explicaciones generales, valen para cualquier empresa) ---------- */
var CONCEPTS = {
  eps: {n: 'Utilidad por acción (EPS)', que: 'La ganancia de la empresa dividida entre el número de acciones. Es lo que le toca a cada acción en utilidades. TTM significa "últimos 12 meses".', lectura: 'Mejor si sube año tras año. Compara el EPS contable con el EPS ajustado que reporta la empresa: el ajustado suele ser mayor.'},
  dps: {n: 'Dividendo por acción', que: 'Lo que la empresa paga en efectivo a sus accionistas por cada acción.', lectura: 'N/A significa que no paga dividendos. Muchas empresas en crecimiento prefieren reinvertir.'},
  bvps: {n: 'Valor en libros por acción', que: 'Patrimonio contable (activos menos deudas) dividido entre las acciones. Es lo que valdría cada acción si se liquidara la empresa a precios contables.', lectura: 'Úsalo junto con el P/B. Si crece de forma estable, la empresa acumula valor.'},
  cfps: {n: 'Flujo de caja por acción', que: 'Efectivo que generan las operaciones, repartido por acción. Es más difícil de manipular que la utilidad contable.', lectura: 'Si es mayor que el EPS, la empresa convierte bien sus ventas en caja.'},
  fcfps: {n: 'Caja libre por acción (FCF)', que: 'El flujo de caja después de pagar las inversiones necesarias para mantener el negocio (capex). Es el dinero que de verdad sobra.', lectura: 'Divídelo entre el precio para obtener el rendimiento de caja libre. Sobre 5% es atractivo, bajo 2% es exigente.'},
  sps: {n: 'Ventas por acción', que: 'Los ingresos totales divididos entre las acciones.', lectura: 'Sirve para ver si crecen las ventas sin que la emisión de acciones lo diluya.'},
  roe: {n: 'Retorno sobre el patrimonio (ROE)', que: 'Cuánta utilidad genera la empresa por cada dólar de los accionistas.', lectura: 'Sobre 15% es bueno y sobre 20% muy bueno. Cuidado: un ROE alto con mucha deuda puede ser engañoso.'},
  roa: {n: 'Retorno sobre los activos (ROA)', que: 'Cuánta utilidad produce cada dólar de activos, sin importar cómo se financiaron.', lectura: 'Sobre 5% es sano. Cada industria tiene su nivel; compara contra empresas similares.'},
  gross: {n: 'Margen bruto', que: 'Porcentaje de las ventas que queda después de pagar el costo directo de producir.', lectura: 'Alto y estable (sobre 60% en tecnología médica) indica poder de precios. Si baja, hay presión de costos o de competencia.'},
  opm: {n: 'Margen operativo', que: 'Porcentaje de las ventas que queda después de pagar todos los gastos de operar (producción, ventas, investigación, administración).', lectura: 'Entre más alto mejor. Que suba mientras las ventas crecen indica eficiencia.'},
  tax: {n: 'Tasa de impuestos', que: 'Porcentaje de la utilidad antes de impuestos que se paga en impuestos.', lectura: 'Una tasa mucho menor a lo normal (15% a 25%) infla la utilidad. Pregunta si es permanente o de un solo año.'},
  interest: {n: 'Tasa de interés promedio', que: 'Lo que la empresa paga en promedio por su deuda.', lectura: 'Menor es mejor. Si es mucho más baja que el retorno del negocio, la deuda trabaja a favor.'},
  npm: {n: 'Margen neto', que: 'Porcentaje de cada dólar vendido que termina como utilidad neta, ya con impuestos e intereses.', lectura: 'Sobre 10% es bueno. Compara con el margen operativo: si están muy separados, hay costos financieros o impuestos pesados.'},
  assetturn: {n: 'Rotación de activos', que: 'Ventas dividido entre activos totales. Mide cuánto vende la empresa por cada dólar que tiene invertido.', lectura: 'Depende de la industria. Lo útil es la tendencia: si sube, los activos trabajan más.'},
  invturn: {n: 'Rotación de inventario', que: 'Cuántas veces al año la empresa vende y repone su inventario.', lectura: 'Más alto significa que el producto se vende rápido. Si cae mientras sube el inventario, puede haber demanda débil.'},
  ltdebt: {n: 'Deuda de largo plazo sobre capital', que: 'Parte del capital total (deuda más patrimonio) que viene de deuda de largo plazo.', lectura: 'Bajo 40% es cómodo para la mayoría de las empresas. Sobre 60% exige vigilar.'},
  leverage: {n: 'Apalancamiento financiero', que: 'Activos divididos entre patrimonio. Indica cuántos dólares de activos se sostienen con cada dólar propio.', lectura: 'Cerca de 1 casi no hay deuda. Entre 1.5 y 2.5 es normal. Más alto significa más riesgo en una crisis.'},
  fixedcov: {n: 'Cobertura de cargos fijos', que: 'Cuántas veces la utilidad cubre los pagos obligatorios (intereses y arriendos).', lectura: 'Sobre 3 es sano y sobre 8 es muy holgado. Bajo 1.5 es una señal de alerta.'},
  payout: {n: 'Razón de pago de dividendos', que: 'Porcentaje de la utilidad que se reparte como dividendo.', lectura: 'Entre 30% y 60% suele ser sostenible. N/A significa que no hay dividendo.'},
  quick: {n: 'Razón rápida (quick ratio)', que: 'Efectivo, inversiones y cuentas por cobrar divididos entre las deudas de corto plazo. No cuenta el inventario.', lectura: 'Sobre 1 la empresa puede pagar sus deudas inmediatas sin vender inventario. Bajo 0.7 vigila la liquidez.'},
  current: {n: 'Razón corriente', que: 'Activos de corto plazo divididos entre deudas de corto plazo.', lectura: 'Sobre 1 es lo mínimo sano, entre 1.5 y 2 es cómodo. La tendencia importa más que el número suelto.'},
  pe: {n: 'Precio sobre utilidad (P/E)', que: 'Cuántos dólares pagas por cada dólar de utilidad anual. Un P/E de 17 significa que recuperarías tu inversión en 17 años con las utilidades de hoy.', lectura: 'Compáralo con el promedio histórico y con empresas similares. Bajo no siempre es barato: puede esperar que la utilidad caiga.'},
  pcf: {n: 'Precio sobre flujo de caja', que: 'Lo mismo que el P/E, pero usando flujo de caja en lugar de utilidad contable.', lectura: 'Menor que su promedio histórico indica que está más barata que antes.'},
  pb: {n: 'Precio sobre valor en libros (P/B)', que: 'Cuántas veces el valor contable del patrimonio paga el mercado.', lectura: 'Bajo 1.5 es barato para sectores con activos tangibles. En empresas con buen ROE se acepta más.'},
  mcapeq: {n: 'Capitalización sobre patrimonio', que: 'Valor de mercado de la empresa dividido entre su patrimonio contable. Es un primo del P/B.', lectura: 'Si baja frente a su promedio, el mercado reconoce menos prima que antes.'},
  divyield: {n: 'Rendimiento por dividendo', que: 'Dividendo anual dividido entre el precio. Es lo que cobras cada año solo por tener la acción.', lectura: 'N/A significa que no paga. Un rendimiento muy alto puede avisar de un precio caído.'},
  divpayout: {n: 'Pago de dividendo sobre EPS', que: 'Lo mismo que la razón de pago, calculada con el EPS.', lectura: '0 significa que no reparte dividendos.'},
  g_rev: {n: 'Crecimiento de ingresos', que: 'Cuánto subieron las ventas frente al periodo anterior. Se muestra el actual y el promedio anual de 3 y 5 años.', lectura: 'Si el actual es menor que el promedio, el crecimiento se está frenando. Es lo primero que vigila el mercado.'},
  g_ni: {n: 'Crecimiento de utilidad neta', que: 'Cuánto subió la utilidad neta frente al periodo anterior.', lectura: 'Cuando crece mucho más que los ingresos, revisa si viene de impuestos bajos, ahorros puntuales o una base muy baja.'},
  g_eps: {n: 'Crecimiento del EPS', que: 'Cuánto subió la utilidad por acción.', lectura: 'Si es menor que el de la utilidad neta, la empresa está emitiendo acciones y diluyendo. Si es mayor, recompra acciones.'},
  g_dps: {n: 'Crecimiento del dividendo', que: 'Cuánto aumentó el dividendo por acción.', lectura: 'Aumentos constantes muestran confianza de la gerencia. N/A si no hay dividendo.'},
  g_bvps: {n: 'Crecimiento del valor en libros', que: 'Cuánto crece el patrimonio contable por acción.', lectura: 'Un crecimiento estable muestra que la empresa acumula valor sin depender del precio de bolsa.'},
  shares: {n: 'Acciones en circulación', que: 'El total de acciones emitidas por la empresa.', lectura: 'Si el número sube con el tiempo hay dilución. Si baja, la empresa recompra acciones.'},
  float: {n: 'Flotante (float)', que: 'Acciones que se pueden comprar y vender libremente, sin contar las de directivos o accionistas que no venden.', lectura: 'Un flotante grande significa más liquidez. Uno pequeño hace al precio más volátil.'},
  mcap: {n: 'Capitalización de mercado', que: 'Precio por acción multiplicado por las acciones en circulación. Es lo que el mercado dice que vale la empresa entera.', lectura: 'Sobre 10 mil millones es una empresa grande. Bajo 2 mil millones es pequeña y más riesgosa.'},
  borrow: {n: 'Tamaño de préstamo aproximado', que: 'Cantidad aproximada de acciones disponibles para pedir prestadas y venderlas en corto (apostar a que baja).', lectura: 'Poca disponibilidad hace costoso apostar en contra. No es por sí solo una señal de que el precio caerá.'},
  inst: {n: 'Propiedad institucional', que: 'Porcentaje de las acciones en manos de fondos, bancos y otros inversionistas profesionales.', lectura: 'Un nivel alto da respaldo, pero si los fondos salen a la vez, el precio lo siente.'}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function fmt(v, f) {
  if (v === null || v === undefined) return 'N/A';
  switch (f) {
    case 'usd': return '$' + v.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    case 'pct': return v.toFixed(1) + '%';
    case 'x': return v.toFixed(2) + 'x';
    case 'int': return Math.round(v).toLocaleString('en-US');
    case 'num': return v.toFixed(2);
    default: return String(v);
  }
}
function spark(vals, now) {
  var pts = vals.slice(); if (now != null) pts.push(now);
  pts = pts.filter(function (v) { return v != null; });
  if (pts.length < 2) return '';
  var w = 130, h = 40, pad = 4, min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
  var span = max - min || 1;
  var xy = pts.map(function (v, i) { return [pad + i * (w - 2 * pad) / (pts.length - 1), h - pad - (v - min) / span * (h - 2 * pad)]; });
  var line = xy.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var area = line + ' L' + xy[xy.length - 1][0].toFixed(1) + ' ' + (h - pad) + ' L' + xy[0][0].toFixed(1) + ' ' + (h - pad) + ' Z';
  var last = xy[xy.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Tendencia: de ' + fmt(pts[0], 'num') + ' a ' + fmt(pts[pts.length - 1], 'num') + '">' +
    '<line x1="' + pad + '" x2="' + (w - pad) + '" y1="' + (h - pad) + '" y2="' + (h - pad) + '" stroke="var(--line)" stroke-width="1"/>' +
    '<path d="' + area + '" fill="var(--accent-soft)"/><path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3.5" fill="var(--accent)"/></svg>';
}

  if (a.scores) h += '<section><div class="sec-head"><h2>Salud financiera en seis puntos</h2><p>Cada nota va de 0 a 10 y resume los ratios de abajo. No es una predicción, es una lectura del estado actual.</p></div><div class="panel"><div class="scores">' +
    a.scores.map(function (s) { return '<div class="score"><span class="name">' + esc(s.label) + '</span><div class="bar" role="img" aria-label="' + s.score + ' de 10"><i style="width:' + (s.score * 10) + '%"></i></div><span class="text"><span class="num">' + s.score + '/10</span> · ' + esc(s.text) + '</span></div>'; }).join('') + '</div></div></section>';

  if (a.strengths || a.risks) h += '<section><div class="sec-head"><h2>Fortalezas y riesgos</h2></div><div class="grid2"><div class="panel"><h3>Lo que juega a favor</h3><ul>' + (a.strengths || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div><div class="panel"><h3>Lo que puede salir mal</h3><ul>' + (a.risks || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div></div></section>';

  if (a.scenarios) h += '<section><div class="sec-head"><h2>Escenarios a 12 meses</h2><p>Las probabilidades son un criterio subjetivo del análisis y suman 100%.</p></div><div class="scen">' +
    a.scenarios.map(function (s) { return '<div class="panel"><span class="pill t-' + s.tone + '">' + esc(s.name) + '</span><span class="px">' + esc(s.price) + '</span><span class="p">Probabilidad ' + s.prob + '%</span><p>' + esc(s.text) + '</p></div>'; }).join('') + '</div></section>';

  if (a.plan) h += '<section><div class="sec-head"><h2>Plan operativo</h2><p>Pensado para una cartera de riesgo moderado y horizonte de 3 a 12 meses.</p></div><div class="panel"><dl class="plan">' + a.plan.map(function (p) { return '<dt>' + esc(p.label) + '</dt><dd>' + esc(p.value) + '</dd>'; }).join('') + '</dl></div></section>';

  h += '<section><div class="sec-head"><h2>Diccionario con tus números</h2><p>Cada concepto de thinkorswim explicado en sencillo, con el valor de ' + esc(d.ticker) + ', su tendencia de ' + esc((d.periods || [])[0] || '') + ' a hoy y una lectura puntual.</p></div>' +
    '<div class="toolbar" role="group" aria-label="Filtrar conceptos"><button class="chip" data-s="all" aria-pressed="' + (state.section === 'all') + '">Todos</button>' +
    d.sections.map(function (s) { return '<button class="chip" data-s="' + esc(s.id) + '" aria-pressed="' + (state.section === s.id) + '">' + esc(s.title) + '</button>'; }).join('') +
    '<input id="q" type="search" placeholder="Buscar concepto" aria-label="Buscar concepto" value="' + esc(state.q) + '"></div>' +
    '<div class="cards" id="cards"></div></section>';

  h += '<footer>' + (a.sources ? '<div><b>Fuentes</b><ul>' + a.sources.map(function (s) { return '<li><a href="' + esc(s.u) + '" target="_blank" rel="noopener">' + esc(s.t) + '</a></li>'; }).join('') + '</ul></div>' : '') + '<p><em>' + esc(a.disclaimer || '') + '</em></p></footer>';
  app.innerHTML = h;

  function fill() {
    var q = state.q.trim().toLowerCase();
    var list = rows.filter(function (r) {
      if (state.section !== 'all' && r.sec !== state.section) return false;
      if (!q) return true;
      var c = CONCEPTS[r.key] || {n: ''};
      return (c.n + ' ' + r.label).toLowerCase().indexOf(q) > -1;
    });
    document.getElementById('cards').innerHTML = list.length ? list.map(function (r) { return cardHTML(r, d.periods); }).join('') : '<p class="muted">Ningún concepto coincide con la búsqueda.</p>';
  }
  fill();
  app.querySelectorAll('.tickers .chip').forEach(function (b) { b.addEventListener('click', function () { state.ticker = b.dataset.t; state.section = 'all'; state.q = ''; try { localStorage.setItem('rf-ticker', state.ticker); } catch (e) {} render(); window.scrollTo(0, 0); }); });
  app.querySelectorAll('.toolbar .chip').forEach(function (b) { b.addEventListener('click', function () { state.section = b.dataset.s; app.querySelectorAll('.toolbar .chip').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); fill(); }); });
  document.getElementById('q').addEventListener('input', function (e) { state.q = e.target.value; fill(); });
}
render();
</script>
